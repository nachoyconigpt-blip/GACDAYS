let rotation=0,busy=false;const spin=document.querySelector('#spin'),result=document.querySelector('#result'),hint=document.querySelector('#hint');function randomIndex(n){const a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}spin.onclick=()=>{if(busy)return;busy=true;spin.disabled=true;hint.textContent='GIRANDO…';const weights=prizes.map(p=>p[0]==='UN AÑO DE SEGURO GRATIS'?1:3);let ticket=randomIndex(weights.reduce((a,b)=>a+b,0)),i=0;while(ticket>=weights[i]){ticket-=weights[i];i++}const offset=(randomIndex(1000)/999-.5)*step*.62,target=(360-(i+.5)*step-offset+360)%360;rotation+=360*6+((target-rotation%360+360)%360);const duration=window.matchMedia('(prefers-reduced-motion: reduce)').matches?1000:5800;svg.style.transition=`transform ${duration}ms cubic-bezier(.12,.72,.08,1)`;svg.style.transform=`rotate(${rotation}deg)`;setTimeout(()=>{document.querySelector('#prize').textContent=prizes[i][0];result.showModal()},duration+80)};function reset(){busy=false;spin.disabled=false;hint.textContent='TOCÁ EL CENTRO PARA GIRAR';spin.focus()}document.querySelector('#again').onclick=()=>result.close();result.addEventListener('close',reset);document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){}};
